services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optimizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optimizer}
      POSTGRES_DB: ${POSTGRES_DB:-ai_cost_optimizer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optimizer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-optimizer}:${POSTGRES_PASSWORD:-optimizer}@postgres:5432/${POSTGRES_DB:-ai_cost_optimizer}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        # NEXT_PUBLIC_* vars are inlined into the browser bundle at build
        # time, so this must be reachable from the *browser* (the host's
        # published backend port), not the Docker-network service name -
        # `http://backend:8000` would only resolve for server-side fetches
        # inside the compose network, and all data fetching here is
        # client-side (TanStack Query). Override via .env if the backend is
        # published on a different host port.
        NEXT_PUBLIC_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- examples/sample-rag-app infra (Phase 4a) ---

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3"]
    ports:
      - "8080:80"
    volumes:
      - tei_data:/data

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./examples/sample-rag-app/litellm-config.yml:/app/litellm-config.yml:ro
    command: ["--config", "/app/litellm-config.yml"]
    environment:
      ZAI_API_KEY: ${ZAI_API_KEY:?ZAI_API_KEY is required}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}

  sample-rag-app:
    build:
      context: .
      dockerfile: examples/sample-rag-app/Dockerfile
    restart: unless-stopped
    environment:
      QDRANT_COLLECTION: ${SAMPLE_RAG_QDRANT_COLLECTION:-sample-corpus}
      QDRANT_URL: http://qdrant:6333
      CHAT_URL: http://litellm-proxy:4000
      CHAT_API_KEY: None
      OPENAI_EMBEDDING_MODEL: ${SAMPLE_RAG_EMBEDDING_MODEL:-bge-m3}
      EMBED_URL: http://tei:80/v1
      EMBED_API_KEY: None
    ports:
      - "8001:8000"
    depends_on:
      - qdrant
      - litellm-proxy
      - tei

volumes:
  postgres_data:
  qdrant_data:
  tei_data:
