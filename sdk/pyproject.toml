[project]
name = "ai-cost-optimizer-sdk"
version = "0.1.0"
description = "Lightweight SDK for connecting an AI application to the AI Cost Optimizer platform"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_cost_optimizer"]
